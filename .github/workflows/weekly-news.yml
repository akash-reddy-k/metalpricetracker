name: Weekly News Generator

on:
  schedule:
    # Every Sunday at 00:30 UTC (~6 AM IST)
    - cron: '30 0 * * 0'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-news:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate weekly news article
        run: npm run generate-news
        env:
          # Free Google AI Studio key. If unset, the script falls back to a
          # deterministic template so the job still produces an article.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.0-flash' }}

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet src/data/news.json && echo "changed=false" >> "$GITHUB_OUTPUT" || echo "changed=true" >> "$GITHUB_OUTPUT"

      # main is protected by a repository ruleset ("Changes must be made through
      # a pull request"), so we cannot push to it directly. Push the generated
      # article to a dated branch, open a PR, and auto-merge it — all via the
      # GitHub REST API (no gh CLI), authenticated with the workflow GITHUB_TOKEN.
      # The change still lands through a PR (satisfying the ruleset); the bot
      # merges its own PR because no approvals are required.
      - name: Open and auto-merge the news PR
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          api() { curl --fail -sS \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" "$@"; }

          DATE="$(date +%Y-%m-%d)"
          BRANCH="news/weekly-$DATE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add src/data/news.json
          git commit -m "chore: add weekly metals news for $DATE"
          git push origin "$BRANCH"

          PR_NUMBER="$(api -X POST "https://api.github.com/repos/$GITHUB_REPOSITORY/pulls" \
            -d "$(printf '{"title":"chore: weekly metals news for %s","head":"%s","base":"main","body":"Automated weekly precious-metals news article generated by the Weekly News Generator workflow."}' "$DATE" "$BRANCH")" \
            | jq -r '.number')"
          echo "Opened PR #$PR_NUMBER"

          # Mergeability can still be computing right after creation, so retry.
          merged=0
          for attempt in 1 2 3 4 5 6; do
            if api -X PUT "https://api.github.com/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/merge" \
              -d '{"merge_method":"squash"}'; then
              echo "Merged PR #$PR_NUMBER"
              merged=1
              break
            fi
            echo "Merge attempt $attempt not ready; retrying in 5s..."
            sleep 5
          done

          if [ "$merged" != "1" ]; then
            echo "::warning::Could not auto-merge PR #$PR_NUMBER; leaving it open for manual merge."
            exit 0
          fi

          # Best-effort cleanup of the merged branch.
          api -X DELETE "https://api.github.com/repos/$GITHUB_REPOSITORY/git/refs/heads/$BRANCH" || true
