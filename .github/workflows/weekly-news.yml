name: Weekly News Generator

on:
  schedule:
    # Every Sunday at 00:30 UTC (~6 AM IST)
    - cron: '30 0 * * 0'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-news:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      # Mint a short-lived installation token for the dedicated GitHub App that
      # is on the branch ruleset's bypass list. The news PR is merged with this
      # token so it can bypass the "Required approvals" rule WITHOUT weakening
      # approvals for human PRs. Requires repo variable NEWS_BOT_APP_ID and
      # secret NEWS_BOT_PRIVATE_KEY (see README / repo settings).
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.NEWS_BOT_APP_ID }}
          private-key: ${{ secrets.NEWS_BOT_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate weekly news article
        run: npm run generate-news
        env:
          # Free Google AI Studio key. If unset, the script falls back to a
          # deterministic template so the job still produces an article.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.8-flash' }}

      - name: Check for changes
        id: changes
        run: |
          # Articles live as individual files under src/data/news/. The generator
          # writes a new file (and may prune old ones), so check the whole folder
          # with `git status --porcelain`, which also sees untracked new files
          # that `git diff` would miss.
          if [ -n "$(git status --porcelain src/data/news)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # main is protected by a repository ruleset ("Changes must be made through
      # a pull request" + "Required approvals"), so we cannot push to it directly
      # and GITHUB_TOKEN can neither approve nor merge past the approval rule.
      # Push the generated article to a per-run branch, open a PR, and merge it —
      # all via the GitHub REST API (no gh CLI), authenticated with the GitHub
      # App installation token minted above. The app is on the ruleset's bypass
      # list, so its merge is allowed without a human approval; human PRs still
      # require approvals.
      - name: Open and auto-merge the news PR
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          api() { curl --fail -sS \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" "$@"; }

          DATE="$(date +%Y-%m-%d)"
          # Branch name must be unique per run: the workflow can now run more than
          # once a day (multiple articles per date are supported), so a plain
          # news/weekly-$DATE branch would collide with a prior run's branch and
          # the push would be rejected. Use a date-timestamp branch that mirrors
          # the article filename convention (src/data/news/<timestamp>.json).
          TS="$(date -u +%Y-%m-%dT%H-%M-%SZ)"
          BRANCH="news/weekly-$TS"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -A src/data/news
          git commit -m "chore: add weekly metals news for $DATE"
          git push origin "$BRANCH"

          PR_NUMBER="$(api -X POST "https://api.github.com/repos/$GITHUB_REPOSITORY/pulls" \
            -d "$(printf '{"title":"chore: weekly metals news for %s","head":"%s","base":"main","body":"Automated weekly precious-metals news article generated by the Weekly News Generator workflow."}' "$DATE" "$BRANCH")" \
            | jq -r '.number')"
          echo "Opened PR #$PR_NUMBER"

          # The app token bypasses the ruleset, so the merge skips BOTH the
          # required approval AND the required status checks — meaning
          # mergeable_state stays "blocked" (approval missing) and can't be used
          # as the go-signal. We still WANT the Cloudflare Pages deploy to finish
          # first, so gate on the head commit's check runs ourselves: wait while
          # any are still queued/in-progress, bail if one fails, and only once
          # they are all green issue the merge (which bypasses the approval).
          # Poll once a minute for up to 15 min, then leave the PR open.
          merged=0
          for attempt in $(seq 1 15); do
            pr_json="$(api "https://api.github.com/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" || echo '{}')"
            state="$(printf '%s' "$pr_json" | jq -r '.mergeable_state // "unknown"')"
            head_sha="$(printf '%s' "$pr_json" | jq -r '.head.sha // empty')"
            echo "Attempt $attempt: PR #$PR_NUMBER mergeable_state=$state"

            if [ "$state" = "dirty" ]; then
              echo "::warning::PR #$PR_NUMBER has merge conflicts; leaving it open."
              break
            fi

            checks_json="$(api "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$head_sha/check-runs" || echo '{}')"
            total="$(printf '%s' "$checks_json" | jq '(.check_runs // []) | length' || echo 0)"
            running="$(printf '%s' "$checks_json" | jq '[(.check_runs // [])[] | select(.status != "completed")] | length' || echo 1)"
            failed="$(printf '%s' "$checks_json" | jq '[(.check_runs // [])[] | select(.conclusion != null and (.conclusion | IN("success","neutral","skipped") | not))] | length' || echo 0)"

            if [ "${failed:-0}" -gt 0 ]; then
              echo "::warning::PR #$PR_NUMBER has a failing check; leaving it open."
              break
            fi
            if [ "${total:-0}" -eq 0 ] || [ "${running:-1}" -gt 0 ]; then
              echo "Checks not green yet (total=$total running=$running); waiting."
              sleep 60
              continue
            fi

            # Checks are green — merge with the bypass token (skips the approval).
            if api -X PUT "https://api.github.com/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/merge" \
              -d '{"merge_method":"squash"}'; then
              echo "Merged PR #$PR_NUMBER"
              merged=1
              break
            fi
            echo "Merge rejected despite green checks; will retry."
            sleep 60
          done

          if [ "$merged" != "1" ]; then
            echo "::warning::Could not auto-merge PR #$PR_NUMBER; leaving it open for manual merge."
            exit 0
          fi

          # Best-effort cleanup of the merged branch.
          api -X DELETE "https://api.github.com/repos/$GITHUB_REPOSITORY/git/refs/heads/$BRANCH" || true
